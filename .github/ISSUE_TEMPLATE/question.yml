name: "Question / 提问"
description: |
  Ask a question about Token Use.
  询问 Token Use 相关问题。
labels:
  - question
body:
  - type: dropdown
    attributes:
      label: Area / 涉及范围
      multiple: true
      options:
        - Local usage / 本地统计
        - GitHub login / GitHub 登录
        - Leaderboard / 排行
        - Backend / 后端
        - Build or packaging / 构建或打包
        - Other / 其他
    validations:
      required: true

  - type: textarea
    attributes:
      label: Your Question / 你的问题
    validations:
      required: true

  - type: textarea
    attributes:
      label: Environment / 环境信息
      placeholder: "e.g. macOS 15.4, Token Use 0.1.0"
    validations:
      required: false
