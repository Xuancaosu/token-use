name: "Documentation Issue / 文档问题"
description: |
  Report outdated, incorrect, or missing documentation.
  报告过时、错误或缺失的文档。
labels:
  - documentation
body:
  - type: input
    attributes:
      label: Document Location / 文档位置
      placeholder: "e.g. README.md#leaderboard-backend"
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Issue Type / 问题类型
      options:
        - Typo or grammar / 拼写或语法错误
        - Outdated content / 内容过时
        - Missing information / 信息缺失
        - Translation issue / 翻译问题
        - Other / 其他
    validations:
      required: true

  - type: textarea
    attributes:
      label: Description / 描述
    validations:
      required: true
