name: "Bug Report / Bug 报告"
description: |
  Report incorrect usage totals, app errors, login failures, or backend issues.
  报告用量统计错误、应用异常、登录失败或后端问题。
labels:
  - bug
body:
  - type: checkboxes
    attributes:
      label: Self Checks / 自检
      options:
        - label: |
            I have read the README and searched existing issues.
            我已阅读 README 并搜索过已有 Issue。
          required: true

  - type: input
    attributes:
      label: Token Use Version / 版本号
      placeholder: "e.g. 0.1.0 or commit hash"
    validations:
      required: true

  - type: input
    attributes:
      label: macOS Version / macOS 版本
      placeholder: "e.g. macOS 15.4"
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Area / 涉及范围
      multiple: true
      options:
        - Local usage statistics / 本地用量统计
        - Menu bar display / 菜单栏展示
        - GitHub login / GitHub 登录
        - Leaderboard / 排行
        - Backend deployment / 后端部署
        - Packaging or update / 打包或更新
        - Other / 其他
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to Reproduce / 复现步骤
      placeholder: |
        1. Open Token Use...
        2. Switch to...
        3. See...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected Behavior / 期望行为
    validations:
      required: true

  - type: textarea
    attributes:
      label: Actual Behavior / 实际行为
    validations:
      required: true

  - type: textarea
    attributes:
      label: Logs or Screenshots / 日志或截图
      description: |
        Please remove secrets and personal usage data before attaching logs.
        附加日志前请移除密钥和个人用量数据。
    validations:
      required: false
