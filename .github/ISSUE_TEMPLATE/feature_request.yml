name: "Feature Request / 功能请求"
description: |
  Propose an improvement for Token Use.
  提出 Token Use 改进建议。
labels:
  - enhancement
body:
  - type: checkboxes
    attributes:
      label: Self Checks / 自检
      options:
        - label: |
            I have checked that this request fits Token Use's usage-monitoring scope.
            我已确认该请求符合 Token Use 的用量统计定位。
          required: true

  - type: dropdown
    attributes:
      label: Area / 涉及范围
      multiple: true
      options:
        - Usage analytics / 用量分析
        - Menu bar / 菜单栏
        - Leaderboard / 排行
        - GitHub login / GitHub 登录
        - Backend / 后端
        - Documentation / 文档
        - Other / 其他
    validations:
      required: true

  - type: textarea
    attributes:
      label: Problem or Motivation / 问题或动机
      placeholder: |
        I was trying to understand... but...
        我想查看……但是……
    validations:
      required: true

  - type: textarea
    attributes:
      label: Proposed Solution / 建议方案
    validations:
      required: true

  - type: textarea
    attributes:
      label: Alternatives / 替代方案
    validations:
      required: false
