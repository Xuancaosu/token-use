name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  macos:
    name: Build macOS App
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm build

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          VERSION="${GITHUB_REF_NAME:-manual}"
          DMG=$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name "*.dmg" -type f | head -1)
          APP=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name "*.app" -type d | head -1)
          cp "$DMG" "release-assets/Token-Use-${VERSION}-macOS-aarch64.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "release-assets/Token-Use-${VERSION}-macOS-aarch64.app.zip"
          ls -la release-assets

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: token-use-macos
          path: release-assets/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: Token Use ${{ github.ref_name }}
          prerelease: true
          body: |
            ## Token Use ${{ github.ref_name }}

            macOS-first token usage monitor with optional GitHub leaderboard ranking.

            This is an early prerelease. The app is not notarized yet.
          files: release-assets/*
